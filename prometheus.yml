global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'adguard'
    static_configs:
      - targets: ['adguard_exporter:9617']

  - job_name: 'squid'
    static_configs:
      - targets: ['squid_exporter:9301']

  - job_name: 'servidor_red'
    static_configs:
      - targets: ['node_exporter:9100']
